<!-- @dsCard group="Media" height=420 subtitle="Placeholder covers, built from tokens" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AlbumArt — preview</title>
<style>
  html, body { margin: 0; }
  body { background: var(--surface-0); }
  .pv { display: flex; flex-direction: column; gap: var(--space-6); padding: var(--space-5) var(--space-6); }
  .sec { display: flex; flex-direction: column; gap: var(--space-3); }
  .sec .overline { color: var(--ink-faint); }
  .rowx { display: flex; align-items: flex-end; flex-wrap: wrap; gap: var(--space-4); }
  .item { display: flex; flex-direction: column; gap: var(--space-2); }
  .item .caption { color: var(--ink-muted); }
</style>
</head>
<body>
<div id="root" class="vs-stage pv"></div>
<script>
  var V = window.Vesper;
  var big = V.artKinds.map(function (k) {
    return '<div class="item">' + V.art(k, 'vs-art--card', k + ' cover') + '<span class="caption">' + k + '</span></div>';
  }).join('');
  document.getElementById('root').innerHTML =
    '<div class="sec"><div class="overline">Card, 176px, radius-md</div><div class="rowx">' + big + '</div></div>' +
    '<div class="sec"><div class="overline">Row 44px, bar 60px, nav 28px, radius-sm</div><div class="rowx">' +
      V.art('harbour', 'vs-art--row') + V.art('tide', 'vs-art--bar') + V.art('moss', 'vs-art--nav') +
    '</div></div>';
</script>
</body>
</html>
