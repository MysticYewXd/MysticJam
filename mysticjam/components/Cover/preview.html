<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vesper</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface-0); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  /* the composition: a 480-wide box on the right half of the 960 layout, clear of the name */
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .arch { fill: var(--accent); }
  .sun { fill: var(--ember); }
  .slab { fill: var(--surface-3); rx: var(--radius-xl); }
  .half { fill: var(--rose); }
  .dot { fill: var(--sea); }
  .ring { fill: none; stroke: var(--surface-3); stroke-width: 4px; }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-family: var(--font-display); font-size: 120px; line-height: .95; font-weight: 500; font-variation-settings: "opsz" 40; letter-spacing: -.02em; color: var(--ink); }
  .tag { margin: var(--space-2) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent arch 144×272 bled off the bottom (the identity colour, largest) · ember disc 112 across (the sun) · surface-3 slab 176×136 bled off the right and bottom · rose half-round 96×48 · sea disc 48 across — about 28% of 960×288
  arrangement one tall arch with satellites: the sun beside it, a slab low on the right, a half-round rising from the bottom edge, gutters space-4
  pattern     concentric rings, from "a low sun and its light": three surface-3 rings around the sun at a space-5 pitch (24px), drawn behind the blocks
  scales      sides and pitch in space-4 and space-5 multiples; slab corner radius-xl; arch top and discs use half their width as radius, as radius-round is 50%
-->
<circle class="ring" cx="232" cy="104" r="128"/>
<circle class="ring" cx="232" cy="104" r="104"/>
<circle class="ring" cx="232" cy="104" r="80"/>
<path class="arch" d="M16 320V120A72 72 0 0 1 160 120V320Z"/>
<circle class="sun" cx="232" cy="104" r="56"/>
<rect class="slab" x="304" y="152" width="200" height="160"/>
<path class="half" d="M176 288A48 48 0 0 1 272 288Z"/>
<circle class="dot" cx="392" cy="88" r="24"/>
</svg>
</div>
<div class="words">
<h1 class="name">Vesper</h1>
<p class="tag">A quiet place to listen.</p>
</div>
</div>
</body>
</html>
