<!-- @dsCard group="Layouts" width=1328 height=810 subtitle="Now-playing view at 1280 by 760" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DesktopNowPlaying — preview</title>
<style>
  html, body { margin: 0; }
  body { background: var(--surface-0); }
  .pv { padding: var(--space-5) var(--space-5); }
  .vs-hero--stack .vs-art--hero { width: var(--size-art-hero); }
</style>
</head>
<body>
<div id="root" class="vs-stage pv"></div>
<script>
  var V = window.Vesper;
  var tracks = V.sample.tracks;
  document.getElementById('root').innerHTML =
    '<div class="vs-window">' + V.sidebar('Home') +
      '<main class="vs-main">' +
        '<div class="vs-main__top"><div>' + V.button('chevron-left', 'Back', { size: 22 }) + V.button('chevron-right', 'Forward', { size: 22 }) + '</div>' +
        '<div>' + V.button('queue', 'Queue', { size: 22 }) + V.button('more', 'More options', { size: 22 }) + '</div></div>' +
        '<div class="vs-main__body">' + V.hero(tracks[0], { stack: true, elapsed: 84, playing: true }) +
          '<aside class="vs-panel" aria-label="Up next"><div class="vs-panel__head"><h3 class="display-sm">Up next</h3><span class="caption">6 songs</span></div>' +
            V.list(tracks.slice(1), { compact: true }) + '</aside>' +
        '</div>' +
      '</main>' +
    '</div>';
  V.mount(document);
</script>
</body>
</html>
